name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      # Lint is currently informational: the codebase has a large pre-existing
      # backlog of no-explicit-any errors (tracked as a P2 cleanup). Surfacing
      # them without blocking lets new issues be seen while the backlog is
      # worked down. Flip continue-on-error to false once lint is green.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
