name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:
    branches: [main, Dev]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      # Lint is a blocking gate (P2 backlog cleared 2026-07-14). Errors fail the
      # build; warnings (e.g. no-img-element) remain non-blocking.
      - name: Lint
        run: npm run lint
